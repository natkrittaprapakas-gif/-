<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>จองที่นั่งห้องเรียน 💖</title>

<style>

body{
  margin:0;
  background:#ffeef5;
  font-family:sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

/* LOGIN */
.login{
  background:white;
  padding:40px;
  border-radius:30px;
  width:320px;
  text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

.login h1{
  color:#a855f7;
}

.login input{
  width:90%;
  padding:14px;
  border-radius:14px;
  border:2px solid #ddd;
  margin-top:15px;
  font-size:16px;
}

.login button{
  margin-top:20px;
  border:none;
  background:#a855f7;
  color:white;
  padding:14px 20px;
  border-radius:16px;
  cursor:pointer;
  font-size:16px;
}

/* CLASSROOM */
.classroom{
  display:none;
  width:1000px;
  background:#fff7fb;
  border-radius:35px;
  padding:30px;
  position:relative;
  box-shadow:0 10px 40px rgba(255,182,193,0.4);
  border:5px solid #ffd6e7;
}

.board{
  width:420px;
  margin:auto;
  background:white;
  color:#ff5c8a;
  text-align:center;
  padding:18px;
  border-radius:25px;
  font-size:28px;
  font-weight:bold;
}

.teacher{
  position:absolute;
  top:30px;
  left:30px;
  background:#ffd166;
  padding:14px 18px;
  border-radius:18px;
  font-weight:bold;
}

.door{
  position:absolute;
  right:20px;
  background:#bde0fe;
  padding:12px 16px;
  border-radius:18px;
  font-weight:bold;
}

.top-door{
  top:80px;
}

.bottom-door{
  bottom:70px;
}

.seats{
  margin-top:70px;

  display:grid;

  grid-template-columns:
    90px 90px
    60px
    90px 90px 90px;

  row-gap:28px;
  column-gap:18px;

  justify-content:center;
}

.seat{
  width:90px;
  height:90px;
  border:none;
  border-radius:25px;
  background:#86efac;
  color:#14532d;
  font-size:14px;
  font-weight:bold;
  cursor:pointer;
}

.booked{
  background:#a855f7;
  color:white;
  border:4px solid #7e22ce;
}

.walkway{
  width:60px;
  height:90px;
}

.empty{
  width:90px;
  height:90px;
}

.back{
  margin-top:40px;
  text-align:center;
  font-size:28px;
  font-weight:bold;
  color:#ff5c8a;
}

/* POPUP */
.popup{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.5);
  display:none;
  justify-content:center;
  align-items:center;
}

.popup-box{
  background:white;
  padding:40px;
  border-radius:30px;
  text-align:center;
}

.popup-box button{
  margin-top:20px;
  border:none;
  background:#a855f7;
  color:white;
  padding:12px 24px;
  border-radius:16px;
  cursor:pointer;
}

</style>
</head>

<body>

<!-- LOGIN -->
<div class="login" id="loginBox">

  <h1>💖 เข้าสู่ระบบ</h1>

  <input
    type="text"
    id="studentId"
    placeholder="กรอกรหัสนักเรียน"
  >

  <button id="loginBtn">
    เข้าใช้งาน
  </button>

</div>

<!-- CLASSROOM -->
<div class="classroom" id="classroom">

  <div class="teacher">
    👩‍🏫 โต๊ะครู
  </div>

  <div class="board">
    🌸 กระดาน / โปรเจคเตอร์ 🌸
  </div>

  <div class="door top-door">
    🚪 เข้า
  </div>

  <div class="door bottom-door">
    🚪 ออก
  </div>

  <div class="seats" id="seats"></div>

  <div class="back">
    🎀 หลังห้อง 🎀
  </div>

</div>

<!-- POPUP -->
<div class="popup" id="popup">

  <div class="popup-box">

    <h1>จองสำเร็จ 💖</h1>

    <p>เจอกันเปิดเทอมนะ ✨</p>

    <button id="closeBtn">
      โอเค
    </button>

  </div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {
  getDatabase,
  ref,
  set,
  onValue,
  get
}
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyB67JLWjFM_CHIf0eLE-xK3bXYiCEhsNJQ",
  authDomain: "apsseatbooking.firebaseapp.com",
  databaseURL: "https://apsseatbooking-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "apsseatbooking",
  storageBucket: "apsseatbooking.firebasestorage.app",
  messagingSenderId: "933618674396",
  appId: "1:933618674396:web:d3e77f8bbc5b792daa2219",
  measurementId: "G-ZCVF6ZYR8X"
};

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

const seatsContainer = document.getElementById("seats");

const popup = document.getElementById("popup");

const closeBtn = document.getElementById("closeBtn");

const loginBtn = document.getElementById("loginBtn");

const studentIdInput = document.getElementById("studentId");

const loginBox = document.getElementById("loginBox");

const classroom = document.getElementById("classroom");

/* จำรหัสนักเรียน */
let currentStudentId =
localStorage.getItem("studentId");

/* LOGIN */
loginBtn.addEventListener("click",()=>{

  const id = studentIdInput.value.trim();

  if(!id){

    alert("กรอกรหัสนักเรียน");

    return;
  }

  localStorage.setItem("studentId",id);

  location.reload();

});

/* ถ้าล็อกอินแล้ว */
if(currentStudentId){

  loginBox.style.display = "none";

  classroom.style.display = "block";

}

closeBtn.addEventListener("click",()=>{

  popup.style.display = "none";

});

/* ผังห้อง */
const layout = [

  "seat","seat","walk","seat","seat","seat",

  "seat","seat","walk","seat","seat","seat",

  "empty","seat","walk","seat","seat","seat",

  "seat","seat","walk","seat","seat","seat",

  "seat","seat","walk","seat","seat","empty"

];

layout.forEach((item,index)=>{

  if(item === "walk"){

    const div = document.createElement("div");

    div.className = "walkway";

    seatsContainer.appendChild(div);

    return;
  }

  if(item === "empty"){

    const div = document.createElement("div");

    div.className = "empty";

    seatsContainer.appendChild(div);

    return;
  }

  const seat = document.createElement("button");

  seat.className = "seat";

  seat.innerHTML = "ว่าง ✨";

  const seatRef = ref(db,"seats/" + index);

  /* REALTIME */
  onValue(seatRef,(snapshot)=>{

    const data = snapshot.val();

    if(data){

      seat.classList.add("booked");

      seat.innerHTML = `
        👤<br>
        ${data.name}
      `;

    }else{

      seat.classList.remove("booked");

      seat.innerHTML = "ว่าง ✨";

    }

  });

  /* CLICK */
  seat.addEventListener("click", async ()=>{

    const snapshot = await get(seatRef);

    const data = snapshot.val();

    /* ถ้ามีคนจอง */
    if(data){

      /* ยกเลิกได้เฉพาะของตัวเอง */
      if(data.studentId === currentStudentId){

        const confirmDelete = confirm(
          "ยกเลิกการจอง ?"
        );

        if(confirmDelete){

          await set(seatRef,null);

        }

      }else{

        alert("ที่นั่งนี้ถูกจองแล้ว 🔒");

      }

      return;
    }

    /* เช็คว่าจองแล้วหรือยัง */
    const allSeats = await get(ref(db,"seats"));

    let alreadyBooked = false;

    allSeats.forEach((child)=>{

      const seatData = child.val();

      if(
        seatData &&
        seatData.studentId === currentStudentId
      ){

        alreadyBooked = true;

      }

    });

    if(alreadyBooked){

      alert("จองได้คนละ 1 ที่ 💖");

      return;
    }

    const name = prompt("กรอกชื่อ 💕");

    if(!name) return;

    await set(seatRef,{
      name:name,
      studentId:currentStudentId
    });

    popup.style.display = "flex";

  });

  seatsContainer.appendChild(seat);

});

</script>

</body>
</html>
